<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checkout Test</title>
  <script src="https://cdn.kushkipagos.com/kushki-checkout.js"></script>
</head>
<body>
  <h2>Checkout Test - Kajita</h2>

  <form id="my-form" method="post" action="http://localhost:3000/checkout/token">
    <input type="hidden" name="cart_id" value="123">
    <button type="button" id="pay-button">Pagar</button>
  </form>

  <script>
    // Inicializa Kushki
    var kushki = new KushkiCheckout({
      kformId: "3pHWqfALB", // tu ID de formulario en UAT
      form: "my-form",
      publicMerchantId: "8e731bb7352a42a9b14d0b2a7f3db526", // tu llave pública
      inTestEnvironment: true,
      amount: {
        subtotalIva: 0,
        iva: 0,
        subtotalIva0: 1000
      }
    });

    // Captura el click en el botón
    document.getElementById("pay-button").addEventListener("click", function() {
      kushki.requestToken({
        callback: function(response) {
          if (response.code) {
            alert("Error generando token: " + response.message);
          } else {
            console.log("Token generado:", response.token);

            // Inserta el token en el formulario
            var form = document.getElementById("my-form");
            var input = document.createElement("input");
            input.type = "hidden";
            input.name = "kushkiToken";
            input.value = response.token;
            form.appendChild(input);

            // Envía el formulario al backend
            form.submit();
          }
        }
      });
    });
  </script>
</body>
</html>
